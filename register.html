<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация</title>
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>Регистрация</h1>

    <form id="reg-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="user@example.com" autocomplete="email" />
        <span class="field-error" id="err-email"></span>
      </div>
      <div class="field">
        <label for="username">Логин</label>
        <input id="username" type="text" placeholder="mylogin" autocomplete="username" />
        <span class="field-error" id="err-username"></span>
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input id="password" type="password" placeholder="Минимум 6 символов" autocomplete="new-password" />
        <span class="field-error" id="err-password"></span>
      </div>
      <div class="field">
        <label for="confirm">Повтор пароля</label>
        <input id="confirm" type="password" placeholder="Повторите пароль" autocomplete="new-password" />
        <span class="field-error" id="err-confirm"></span>
      </div>
      <div class="form-error hidden" id="form-error"></div>
      <button type="submit" id="submit-btn">Создать аккаунт</button>
    </form>

    <p class="auth-link">Уже есть аккаунт? <a href="login.html">Войти</a></p>
  </div>

  <script type="module" src="src/pages/register.js"></script>
</body>
</html>
