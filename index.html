<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню Пиццы</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Заказ Пиццы</h1>
        <div class="menu">
            <!-- Левая часть: Выбор пиццы -->
            <div class="pizza-selection">
                <h2>Выберите пиццу:</h2>
                <div class="pizza-images">
                    <div class="pizza-item" data-type="Маргарита">
                        <img src="assets/img/марго.avif" alt="Маргарита" class="pizza-image">
                        <p>Маргарита</p>
                    </div>
                    <div class="pizza-item" data-type="Пепперони">
                        <img src="assets/img/пепа.avif" alt="Пепперони" class="pizza-image">
                        <p>Пепперони</p>
                    </div>
                    <div class="pizza-item" data-type="Баварская">
                        <img src="assets/img/бавар.avif" alt="Баварская" class="pizza-image">
                        <p>Баварская</p>
                    </div>
                </div>
            </div>
            <!-- Правая часть: Выбор параметров -->
            <div class="order-details">
                <!-- Выбор размера -->
                <div id="sizeDiv">
                    <h2>Выберите размер:</h2>
                    <div class="size-selector">
                        <label class="size-option">
                            <input type="radio" name="size" value="Маленькая">
                            <span>Маленькая</span>
                        </label>
                        <label class="size-option">
                            <input type="radio" name="size" value="Большая">
                            <span>Большая</span>
                        </label>
                    </div>
                </div>
                <!-- Добавки -->
                <div id="toppingsDiv">
                    <h2>Добавить по вкусу:</h2>
                    <div class="topping-images">
                        <div class="topping-item" data-topping="сырный борт">
                            <img src="assets/img/борт.png" alt="Сырный бортик">
                            <p>Сырный <br>бортик</p>
                        </div>
                        <div class="topping-item" data-topping="сливочная моцарелла">
                            <img src="assets/img/моц.png" alt="Сливочная моцарелла">
                            <p>Сливочная <br>моцарелла</p>
                        </div>
                        <div class="topping-item" data-topping="чедер и пармезан">
                            <img src="assets/img/чедр.png" alt="Чеддер и пармезан">
                            <p>Чеддер и <br>пармезан</p>
                        </div>
                    </div>
                </div>
                <!-- Кнопка расчета -->
                <button id="calculateBtn">Добавить в корзину за <br>
                    <span id="price">0</span> рублей (<span id="calories">0</span> Ккалорий)
                </button>
            </div>
        </div>
        <p id="result"></p>
    </div>
    <script src="pizza.js"></script>
</body>
</html>
