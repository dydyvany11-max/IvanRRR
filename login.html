<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход</title>
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>Вход в систему</h1>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Логин</label>
        <input id="username" type="text" placeholder="emilys" autocomplete="username" />
        <span class="field-error" id="err-username"></span>
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input id="password" type="password" placeholder="••••••" autocomplete="current-password" />
        <span class="field-error" id="err-password"></span>
      </div>
      <div class="form-error hidden" id="form-error"></div>
      <button type="submit" id="submit-btn">Войти</button>
    </form>

    <p class="auth-link">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
    <p class="hint">Демо: логин <strong>emilys</strong> / пароль <strong>emilyspass</strong></p>
  </div>

  <script type="module" src="src/pages/login.js"></script>
</body>
</html>
